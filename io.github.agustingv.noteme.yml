app-id: io.github.agustingv.noteme
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: noteme

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home

modules:
  - name: noteme
    buildsystem: meson
    sources:
      - type: dir
        path: .
